apiVersion: 1
groups:
    - orgId: 1
      name: Availability and alarms
      folder: RabbitMQ
      interval: 30s
      rules:
        - uid: bfmt4z5nvdddsc
          title: RabbitMQ memory alarm is active
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: max by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus) (rabbitmq_alarms_memory_used_watermark{job=~"rabbitmq.*"})
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: rabbitmq-management-overview-extended
          panelId: 101
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            __dashboardUid__: rabbitmq-management-overview-extended
            __panelId__: "101"
            description: |-
                RabbitMQ resource alarm is active. Check memory, disk, connections and publisher blocking. Value: {{ $values.RA.Value }}.
                {{ if $labels.job }}
                job: {{ $labels.job }}{{ end }}{{ if $labels.projectid }}
                projectid: {{ $labels.projectid }}{{ end }}{{ if $labels.domain }}
                domain: {{ $labels.domain }}{{ end }}{{ if $labels.environment }}
                environment: {{ $labels.environment }}{{ end }}{{ if $labels.platform }}
                platform: {{ $labels.platform }}{{ end }}{{ if $labels.instance }}
                instance: {{ $labels.instance }}{{ end }}{{ if $labels.cluster }}
                cluster: {{ $labels.cluster }}{{ end }}{{ if $labels.k8s_cluster_name }}
                k8s_cluster_name: {{ $labels.k8s_cluster_name }}{{ end }}{{ if $labels.prometheus }}
                prometheus: {{ $labels.prometheus }}{{ end }}
                Evaluation interval: 30s
                Pending period: 1m
                Observed: memory alarm={{ $values.RA.Value }}
            summary: 'RabbitMQ memory watermark alarm: alarm={{ printf "%.0f" $values.RA.Value }} (threshold >0 for 1m); publisher blocking may delay message delivery.{{ if $labels.projectid }} | project={{ $labels.projectid }}{{ end }}{{ if $labels.environment }} | env={{ $labels.environment }}{{ end }}{{ if $labels.domain }} | domain={{ $labels.domain }}{{ end }}{{ if $labels.instance }} | instance={{ $labels.instance }}{{ end }}'
          labels:
            alert_scope: node
            category: availability-and-alarms
            service: rabbitmq
            severity: critical
          isPaused: false
          notification_settings:
            receiver: OnCall
        - uid: ffmt54yhu9qf4a
          title: RabbitMQ disk alarm is active
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: max by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus) (rabbitmq_alarms_free_disk_space_watermark{job=~"rabbitmq.*"})
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: rabbitmq-management-overview-extended
          panelId: 102
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            __dashboardUid__: rabbitmq-management-overview-extended
            __panelId__: "102"
            description: |-
                RabbitMQ resource alarm is active. Check memory, disk, connections and publisher blocking. Value: {{ $values.RA.Value }}.
                {{ if $labels.job }}
                job: {{ $labels.job }}{{ end }}{{ if $labels.projectid }}
                projectid: {{ $labels.projectid }}{{ end }}{{ if $labels.domain }}
                domain: {{ $labels.domain }}{{ end }}{{ if $labels.environment }}
                environment: {{ $labels.environment }}{{ end }}{{ if $labels.platform }}
                platform: {{ $labels.platform }}{{ end }}{{ if $labels.instance }}
                instance: {{ $labels.instance }}{{ end }}{{ if $labels.cluster }}
                cluster: {{ $labels.cluster }}{{ end }}{{ if $labels.k8s_cluster_name }}
                k8s_cluster_name: {{ $labels.k8s_cluster_name }}{{ end }}{{ if $labels.prometheus }}
                prometheus: {{ $labels.prometheus }}{{ end }}
                Evaluation interval: 30s
                Pending period: 1m
                Observed: disk alarm={{ $values.RA.Value }}
            summary: 'RabbitMQ low-disk alarm: alarm={{ printf "%.0f" $values.RA.Value }} (threshold >0 for 1m); insufficient free disk may block publishers.{{ if $labels.projectid }} | project={{ $labels.projectid }}{{ end }}{{ if $labels.environment }} | env={{ $labels.environment }}{{ end }}{{ if $labels.domain }} | domain={{ $labels.domain }}{{ end }}{{ if $labels.instance }} | instance={{ $labels.instance }}{{ end }}'
          labels:
            alert_scope: node
            category: availability-and-alarms
            service: rabbitmq
            severity: critical
          isPaused: false
          notification_settings:
            receiver: OnCall
        - uid: efmt5a8ib7j7kf
          title: RabbitMQ file descriptor alarm is active
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: max by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus) (rabbitmq_alarms_file_descriptor_limit{job=~"rabbitmq.*"})
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: |-
                RabbitMQ resource alarm is active. Check memory, disk, connections and publisher blocking. Value: {{ $values.RA.Value }}.
                {{ if $labels.job }}
                job: {{ $labels.job }}{{ end }}{{ if $labels.projectid }}
                projectid: {{ $labels.projectid }}{{ end }}{{ if $labels.domain }}
                domain: {{ $labels.domain }}{{ end }}{{ if $labels.environment }}
                environment: {{ $labels.environment }}{{ end }}{{ if $labels.platform }}
                platform: {{ $labels.platform }}{{ end }}{{ if $labels.instance }}
                instance: {{ $labels.instance }}{{ end }}{{ if $labels.cluster }}
                cluster: {{ $labels.cluster }}{{ end }}{{ if $labels.k8s_cluster_name }}
                k8s_cluster_name: {{ $labels.k8s_cluster_name }}{{ end }}{{ if $labels.prometheus }}
                prometheus: {{ $labels.prometheus }}{{ end }}
                Evaluation interval: 30s
                Pending period: 1m
                Observed: FD alarm={{ $values.RA.Value }}
            summary: 'RabbitMQ file descriptor alarm: alarm={{ printf "%.0f" $values.RA.Value }} (threshold >0 for 1m); descriptor exhaustion threatens new connections and file access.{{ if $labels.projectid }} | project={{ $labels.projectid }}{{ end }}{{ if $labels.environment }} | env={{ $labels.environment }}{{ end }}{{ if $labels.domain }} | domain={{ $labels.domain }}{{ end }}{{ if $labels.instance }} | instance={{ $labels.instance }}{{ end }}'
          labels:
            alert_scope: node
            category: availability-and-alarms
            service: rabbitmq
            severity: critical
          isPaused: false
          notification_settings:
            receiver: OnCall
        - uid: rmq-scrape-down
          title: RabbitMQ metrics target is unavailable
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: min by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus) (up{job=~"rabbitmq.*"})
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: |-
                The configured scrape target has been failing for 2 minutes. This detects monitoring endpoint failure, not proof that the broker process is down.
                {{ if $labels.job }}
                job: {{ $labels.job }}{{ end }}{{ if $labels.projectid }}
                projectid: {{ $labels.projectid }}{{ end }}{{ if $labels.domain }}
                domain: {{ $labels.domain }}{{ end }}{{ if $labels.environment }}
                environment: {{ $labels.environment }}{{ end }}{{ if $labels.platform }}
                platform: {{ $labels.platform }}{{ end }}{{ if $labels.instance }}
                instance: {{ $labels.instance }}{{ end }}{{ if $labels.cluster }}
                cluster: {{ $labels.cluster }}{{ end }}{{ if $labels.k8s_cluster_name }}
                k8s_cluster_name: {{ $labels.k8s_cluster_name }}{{ end }}{{ if $labels.prometheus }}
                prometheus: {{ $labels.prometheus }}{{ end }}
                Evaluation interval: 30s
                Pending period: 2m
                Observed: up={{ $values.RA.Value }}
            summary: 'RabbitMQ metrics endpoint unavailable: up={{ printf "%.0f" $values.RA.Value }} (expected 1) for 2m; monitoring cannot scrape this target.{{ if $labels.projectid }} | project={{ $labels.projectid }}{{ end }}{{ if $labels.environment }} | env={{ $labels.environment }}{{ end }}{{ if $labels.domain }} | domain={{ $labels.domain }}{{ end }}{{ if $labels.instance }} | instance={{ $labels.instance }}{{ end }}'
          labels:
            alert_scope: node
            category: availability-and-alarms
            service: rabbitmq
            severity: critical
          isPaused: true
          notification_settings:
            receiver: OnCall
        - uid: rmq-targets-missing
          title: RabbitMQ scrape targets are missing
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: absent(up{job=~"rabbitmq.*"}) or vector(0)
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            description: |-
                No up series exist for the configured RabbitMQ job scope. Check service discovery and scrape configuration. This cannot detect one removed target while others remain.

                Scope: all jobs matching rabbitmq.*. This alert cannot carry instance, project or cluster labels because the source series are absent. Evaluation: 30s; pending: 5m.
            summary: 'RabbitMQ monitoring coverage missing: absent(up)={{ printf "%.0f" $values.RA.Value }} (1 means no targets) for 5m; no scrape targets found for job scope rabbitmq.*.'
          labels:
            alert_scope: monitoring
            category: availability-and-alarms
            service: rabbitmq
            severity: critical
          isPaused: false
          notification_settings:
            receiver: OnCall
    - orgId: 1
      name: PRD - Delivery reliability
      folder: RabbitMQ
      interval: 30s
      rules:
        - uid: rmq-unroutable-dropped
          title: '[PRD] RabbitMQ unroutable messages dropped'
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: sum by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus, vhost, exchange) (increase(rabbitmq_channel_messages_unroutable_dropped_total{job=~"rabbitmq.*", environment="prd"}[5m]))
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: rabbitmq-queue-details-consolidated
          panelId: 3001
          noDataState: OK
          execErrState: Error
          annotations:
            __dashboardUid__: rabbitmq-queue-details-consolidated
            __panelId__: "3001"
            description: |-
                Exchange{{ if $labels.exchange }} {{ $labels.exchange }}{{ end }}{{ if $labels.vhost }} in VHOST {{ $labels.vhost }}{{ end }}: {{ $values.RA.Value }} unroutable dropped messages estimated over 5 minutes. Aggregated after per-channel increase; short-lived channels may be missed.
                {{ if $labels.job }}
                job: {{ $labels.job }}{{ end }}{{ if $labels.projectid }}
                projectid: {{ $labels.projectid }}{{ end }}{{ if $labels.domain }}
                domain: {{ $labels.domain }}{{ end }}{{ if $labels.environment }}
                environment: {{ $labels.environment }}{{ end }}{{ if $labels.platform }}
                platform: {{ $labels.platform }}{{ end }}{{ if $labels.instance }}
                instance: {{ $labels.instance }}{{ end }}{{ if $labels.cluster }}
                cluster: {{ $labels.cluster }}{{ end }}{{ if $labels.k8s_cluster_name }}
                k8s_cluster_name: {{ $labels.k8s_cluster_name }}{{ end }}{{ if $labels.prometheus }}
                prometheus: {{ $labels.prometheus }}{{ end }}{{ if $labels.vhost }}
                vhost: {{ $labels.vhost }}{{ end }}{{ if $labels.exchange }}
                exchange: {{ $labels.exchange }}{{ end }}
                Evaluation interval: 30s
                Pending period: 0s
                Observed: dropped={{ $values.RA.Value }} messages / 5m
                Environment scope: prd only (exact source metric label match).
            summary: '[PRD] RabbitMQ routing failure: approximately {{ printf "%.2f" $values.RA.Value }} unroutable messages dropped in the last 5m (threshold >0); these messages were not routed to a queue.{{ if $labels.projectid }} | project={{ $labels.projectid }}{{ end }}{{ if $labels.environment }} | env={{ $labels.environment }}{{ end }}{{ if $labels.domain }} | domain={{ $labels.domain }}{{ end }}{{ if $labels.instance }} | instance={{ $labels.instance }}{{ end }}{{ if $labels.vhost }} | vhost={{ $labels.vhost }}{{ end }}{{ if $labels.exchange }} | exchange={{ $labels.exchange }}{{ end }}'
          labels:
            alert_scope: exchange
            category: delivery-reliability
            environment: prd
            service: rabbitmq
            severity: critical
          isPaused: true
          notification_settings:
            receiver: OnCall
        - uid: rmq-unroutable-returned
          title: '[PRD] RabbitMQ unroutable messages returned'
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: sum by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus, vhost, exchange) (increase(rabbitmq_channel_messages_unroutable_returned_total{job=~"rabbitmq.*", environment="prd"}[5m]))
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - RA
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: RA
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: rabbitmq-queue-details-consolidated
          panelId: 3002
          noDataState: OK
          execErrState: Error
          annotations:
            __dashboardUid__: rabbitmq-queue-details-consolidated
            __panelId__: "3002"
            description: |-
                Exchange{{ if $labels.exchange }} {{ $labels.exchange }}{{ end }}{{ if $labels.vhost }} in VHOST {{ $labels.vhost }}{{ end }}: {{ $values.RA.Value }} unroutable returned messages estimated over 5 minutes. Aggregated after per-channel increase; short-lived channels may be missed.
                {{ if $labels.job }}
                job: {{ $labels.job }}{{ end }}{{ if $labels.projectid }}
                projectid: {{ $labels.projectid }}{{ end }}{{ if $labels.domain }}
                domain: {{ $labels.domain }}{{ end }}{{ if $labels.environment }}
                environment: {{ $labels.environment }}{{ end }}{{ if $labels.platform }}
                platform: {{ $labels.platform }}{{ end }}{{ if $labels.instance }}
                instance: {{ $labels.instance }}{{ end }}{{ if $labels.cluster }}
                cluster: {{ $labels.cluster }}{{ end }}{{ if $labels.k8s_cluster_name }}
                k8s_cluster_name: {{ $labels.k8s_cluster_name }}{{ end }}{{ if $labels.prometheus }}
                prometheus: {{ $labels.prometheus }}{{ end }}{{ if $labels.vhost }}
                vhost: {{ $labels.vhost }}{{ end }}{{ if $labels.exchange }}
                exchange: {{ $labels.exchange }}{{ end }}
                Evaluation interval: 30s
                Pending period: 0s
                Observed: returned={{ $values.RA.Value }} messages / 5m
                Environment scope: prd only (exact source metric label match).
            summary: '[PRD] RabbitMQ routing failure: approximately {{ printf "%.2f" $values.RA.Value }} unroutable messages returned to publishers in the last 5m (threshold >0); check exchange bindings and routing keys.{{ if $labels.projectid }} | project={{ $labels.projectid }}{{ end }}{{ if $labels.environment }} | env={{ $labels.environment }}{{ end }}{{ if $labels.domain }} | domain={{ $labels.domain }}{{ end }}{{ if $labels.instance }} | instance={{ $labels.instance }}{{ end }}{{ if $labels.vhost }} | vhost={{ $labels.vhost }}{{ end }}{{ if $labels.exchange }} | exchange={{ $labels.exchange }}{{ end }}'
          labels:
            alert_scope: exchange
            category: delivery-reliability
            environment: prd
            service: rabbitmq
            severity: warning
          isPaused: true
          notification_settings:
            receiver: OnCall
        - uid: afwivam51jzlsb
          title: '[PRD] RabbitMQ high redelivery ratio'
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: sum by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus) (rate(rabbitmq_global_messages_redelivered_total{job=~"rabbitmq.*", environment="prd"}[5m]))
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: PROMETHEUS_DS
              model:
                datasource:
                    type: prometheus
                    uid: PROMETHEUS_DS
                editorMode: code
                expr: sum by (job, domain, environment, instance, platform, projectid, cluster, k8s_cluster_name, prometheus) (rate(rabbitmq_global_messages_delivered_total{job=~"rabbitmq.*", environment="prd"}[5m]))
                format: time_series
                instant: true
                intervalMs: 30000
                maxDataPoints: 2400
                range: false
                refId: B
            - refId: RA
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RA
                type: reduce
            - refId: RB
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: RB
                type: reduce
            - refId: M
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: ($RB > 1) && ($RA > 0.1 * $RB)
                intervalMs: 1000
                maxDataPoints: 43200
                refId: M
                type: math
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - M
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: M
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
            - refId: V
              datasourceUid: __expr__
              model:
                datasource:
