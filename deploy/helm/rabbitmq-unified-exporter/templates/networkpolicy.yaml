{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.brokerCIDRs) }}
{{- fail "networkPolicy.brokerCIDRs is required when networkPolicy.enabled=true" }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rabbitmq-unified-exporter.fullname" . }}
  labels:
    {{- include "rabbitmq-unified-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rabbitmq-unified-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- $cidrs := .Values.networkPolicy.brokerCIDRs | default list }}
    {{- range .Values.networkPolicy.brokerPorts }}
    - ports:
        - protocol: TCP
          port: {{ . }}
      {{- if $cidrs }}
      to:
        {{- range $cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
