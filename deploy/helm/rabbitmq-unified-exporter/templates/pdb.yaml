{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rabbitmq-unified-exporter.fullname" . }}
  labels:
    {{- include "rabbitmq-unified-exporter.labels" . | nindent 4 }}
spec:
  {{- if and (hasKey .Values.podDisruptionBudget "maxUnavailable") (not (empty .Values.podDisruptionBudget.maxUnavailable)) }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else if le (int .Values.replicaCount) 1 }}
  # Single replica: allow voluntary disruption (drain) instead of blocking on minAvailable: 1.
  maxUnavailable: 1
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rabbitmq-unified-exporter.selectorLabels" . | nindent 6 }}
{{- end }}
