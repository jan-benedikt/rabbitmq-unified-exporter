name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin to commit SHA for supply-chain hardening (tag v4.2.2).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test -race -count=1 -timeout 120s ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Alertlint
        run: go run ./tools/alertlint -alerts alerts.yaml,alerts/rabbitmq-availability-alerts.migrated.yml,alerts/rabbitmq_alerts.migrated.yaml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26.x"
      - name: Build
        run: go build -o rabbitmq-unified-exporter ./cmd/rabbitmq-unified-exporter
      - name: Docker build
        run: docker build -t rabbitmq-unified-exporter:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rabbitmq-unified-exporter:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint deploy/helm/rabbitmq-unified-exporter
      - name: Helm template
        run: >
          helm template test deploy/helm/rabbitmq-unified-exporter
          --set serviceMonitor.enabled=true
          --set networkPolicy.enabled=true
          --set 'networkPolicy.brokerCIDRs={10.0.0.0/8}'
          > /tmp/manifests.yaml
