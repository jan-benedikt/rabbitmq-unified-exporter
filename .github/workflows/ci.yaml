name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Pin to commit SHA for supply-chain hardening.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test -race -count=1 -timeout 120s ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Alertlint
        run: go run ./tools/alertlint -alerts alerts.yaml,alerts/rabbitmq-availability-alerts.migrated.yml,alerts/rabbitmq_alerts.migrated.yaml

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
      - name: Build
        run: go build -o rabbitmq-unified-exporter ./cmd/rabbitmq-unified-exporter
      - name: Docker build
        run: docker build -t rabbitmq-unified-exporter:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rabbitmq-unified-exporter:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint deploy/helm/rabbitmq-unified-exporter
      - name: Helm template
        run: >
          helm template test deploy/helm/rabbitmq-unified-exporter
          --set serviceMonitor.enabled=true
          --set networkPolicy.enabled=true
          --set 'networkPolicy.brokerCIDRs={10.0.0.0/8}'
          > /tmp/manifests.yaml
