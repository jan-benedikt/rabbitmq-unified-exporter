name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin to commit SHA for supply-chain hardening (tag v4.2.2).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a21 # v5.2.0
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test -race -count=1 -timeout 120s ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Alertlint
        run: go run ./tools/alertlint -alerts alerts.yaml,alerts/rabbitmq-availability-alerts.migrated.yml,alerts/rabbitmq_alerts.migrated.yaml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a21 # v5.2.0
        with:
          go-version: "1.26.x"
      - name: Build
        run: go build -o rabbitmq-unified-exporter ./cmd/rabbitmq-unified-exporter
      - name: Docker build
        run: docker build -t rabbitmq-unified-exporter:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6f9d439d418acd900440d4bcb # 0.28.0
        with:
          image-ref: rabbitmq-unified-exporter:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad79782e4f8aaf25d7e7 # v4.2.0
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint deploy/helm/rabbitmq-unified-exporter
      - name: Helm template
        run: helm template test deploy/helm/rabbitmq-unified-exporter --set serviceMonitor.enabled=true --set networkPolicy.enabled=true > /tmp/manifests.yaml
